<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>mfe-catalogo (modo independiente)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="http://localhost:8085/tokens.css">
  <style>
    body { font-family: var(--upc-fuente-base, 'Hanken Grotesk', system-ui, sans-serif); margin: 24px; background: var(--upc-color-fondo, #f4eedd); color: var(--upc-color-texto, #1c2b21); }
    .banda { background: #f9efc9; border: 1px dashed #c9a227; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="banda">Modo independiente: el equipo de Catálogo prueba su micro frontend sin el contenedor.</div>
  <div id="raiz-local"></div>
  <h3>Eventos publicados</h3>
  <ul id="eventos"></ul>

  <script src="catalogo.js"></script>
  <script>
    window.renderCatalogo('raiz-local');
    // Simulamos a los "consumidores" del evento para verificar el contrato
    window.addEventListener('carrito:agregar', function (e) {
      const li = document.createElement('li');
      li.textContent = 'carrito:agregar → ' + JSON.stringify(e.detail);
      document.getElementById('eventos').appendChild(li);
    });
  </script>
</body>
</html>
